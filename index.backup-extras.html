<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1f3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carta do dia">
<link rel="apple-touch-icon" href="icon.png?v=2">
<link rel="icon" type="image/png" href="icon.png?v=2">
<title>Carta do dia ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --noite: #2a1f3d;
    --papel: #f4eff9;
    --tinta: #3b2a55;
    --rosa: #c2456b;
    --suave: #7a6a94;
    --linha: #d9cfe8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--noite);
    color: var(--tinta);
    font-family: "Newsreader", Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }
  .carta {
    width: 100%;
    max-width: 560px;
    background: var(--papel);
    border-radius: 6px;
    padding: 40px 36px 36px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    visibility: hidden;
    opacity: 0;
  }
  .carta.visivel { visibility: visible; opacity: 1; animation: abrir .9s ease-out both; }
  @keyframes abrir {
    from { opacity: 0; transform: translateY(18px) rotate(-.6deg); }
    to   { opacity: 1; transform: none; }
  }
  .data { margin: 0 0 5px; color: var(--suave); font-style: italic; font-size: 1rem; }
  .data::first-letter { text-transform: uppercase; }
  .clima { margin: 0 0 28px; font-size: 1rem; color: var(--suave); line-height: 1.55; min-height: 1.4em; }
  .clima strong { color: var(--rosa); font-size: 1.15rem; font-weight: 500; }
  .clima .detalhes { font-size: .92rem; }
  .clima .cuidado { color: var(--tinta); }
  .foto {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 3px;
    margin: 0 0 28px;
    background: #ddd3ea;
    transform: rotate(-1deg);
    border: 8px solid #fff;
    box-shadow: 0 6px 16px rgba(59, 42, 85, .18);
  }
  .mensagem { font-family: "Caveat", cursive; font-size: 2rem; line-height: 1.3; font-weight: 500; margin: 0 0 28px; }
  .assinatura { font-family: "Caveat", cursive; font-size: 1.7rem; color: var(--rosa); margin: 0 0 24px; }
  .juntos { border-top: 1px solid var(--linha); padding-top: 16px; margin: 0; font-size: 1rem; color: var(--suave); }
  .juntos strong { color: var(--rosa); font-weight: 400; font-size: 1.15rem; }
  @media (max-width: 420px) {
    .carta { padding: 28px 22px; }
    .mensagem { font-size: 1.7rem; }
  }
  /* ===== CALENDÁRIO ===== */
  .carta.oculta { display: none; }
  .topo { display: flex; justify-content: flex-end; gap: 8px; margin: -18px 0 16px; }
  .btn-nav {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 8px 18px;
    border: 1px solid var(--linha); border-radius: 999px;
    background: #fff; color: var(--rosa); cursor: pointer;
    font-family: "Newsreader", Georgia, serif; font-size: 1rem;
    box-shadow: 0 2px 8px rgba(59, 42, 85, .10);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-nav:hover { background: #f4eaf3; }
  .btn-nav:active { transform: scale(.95); box-shadow: none; }
  #voltar-carta { margin-bottom: 8px; }

  /* troca de tela: a nova tela desliza suavemente */
  .calendario { animation: entrarDireita .35s ease-out both; }
  .carta.visivel.volta { animation: entrarEsquerda .35s ease-out both; }
  @keyframes entrarDireita {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes entrarEsquerda {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: none; }
  }
  .calendario {
    width: 100%; max-width: 560px; align-self: flex-start;
    background: var(--papel); border-radius: 6px; padding: 28px 24px 32px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .cal-titulo { font-family: "Caveat", cursive; font-size: 2.2rem; font-weight: 500; margin: 8px 0 14px; color: var(--tinta); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 1.15rem; }
  .cal-nav button {
    border: 0; background: #e8dff3; color: var(--tinta); cursor: pointer;
    width: 38px; height: 38px; border-radius: 50%; font-size: 1.4rem; line-height: 1;
  }
  .cal-mes::first-letter { text-transform: uppercase; }
  .cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .cal-cab { font-size: .85rem; color: var(--suave); padding-bottom: 4px; }
  .cal-dia {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 1rem; color: var(--tinta);
  }
  .cal-dia.lido { background: var(--rosa); color: #fff; }
  .cal-dia.lido::after { content: "✓"; position: absolute; top: 1px; right: 5px; font-size: .62rem; }
  .cal-dia.hoje { outline: 2px solid var(--tinta); outline-offset: 1px; }
  .cal-resumo { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 1rem; color: var(--suave); }

  /* ===== CONFIRMAR LEITURA ===== */
  .confirmar { margin: 0 0 24px; }
  .btn-lida {
    border: 0; border-radius: 999px; padding: 12px 24px;
    background: var(--rosa); color: #fff; cursor: pointer;
    font-family: "Newsreader", Georgia, serif; font-size: 1.05rem;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-lida.lida { background: #e8dff3; color: var(--suave); cursor: default; }
  .sequencia { margin: 10px 0 0; font-size: .95rem; color: var(--suave); }

  /* ===== JOGO DE PONTOS ===== */
  .jogo { margin: 0 0 24px; padding: 16px; background: #fff; border: 1px solid var(--linha); border-radius: 10px; }
  .jogo-topo { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; color: var(--suave); }
  .jogo-topo strong { color: var(--rosa); font-size: 1.2rem; font-weight: 500; }
  .barra { height: 10px; background: #e8dff3; border-radius: 999px; overflow: hidden; margin: 10px 0 14px; }
  .barra-cheia { height: 100%; width: 0; background: var(--rosa); border-radius: 999px; transition: width .6s ease; }
  .jogo-linha { display: flex; align-items: center; gap: 12px; }
  .roleta {
    flex: 0 0 64px; height: 64px; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; background: var(--noite); color: #fff;
    font-family: "Caveat", cursive; font-size: 2.2rem;
  }
  .roleta.girando { animation: tremer .15s linear infinite; }
  @keyframes tremer { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .btn-jogar {
    flex: 1; min-height: 52px; border: 0; border-radius: 12px;
    background: var(--rosa); color: #fff; cursor: pointer;
    font-family: "Newsreader", Georgia, serif; font-size: 1.05rem;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-jogar:disabled { background: #e8dff3; color: var(--suave); cursor: default; }
  .jogo-msg { margin: 10px 0 0; font-size: .95rem; color: var(--suave); min-height: 1.3em; }

  .premio-btn {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid #ffd978;
    background: var(--tinta); color: #fff; font-size: 1.9rem; line-height: 1; cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 217, 120, .75), 0 8px 22px rgba(0, 0, 0, .4);
    animation: pulsar 1.4s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .premio-btn::after {
    content: "✨"; position: absolute; top: -10px; right: -8px; font-size: 1.15rem;
    animation: brilho 1.2s ease-in-out infinite;
  }
  @keyframes brilho {
    0%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.2) rotate(20deg); }
  }
  .premio-btn[hidden], .premio-tela[hidden] { display: none; }
  .premio-tela {
    position: fixed; inset: 0; z-index: 20; background: rgba(20, 12, 32, .95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; color: var(--papel); text-align: center;
  }
  .premio-tela img { max-width: 100%; max-height: 60vh; border-radius: 6px; border: 8px solid #fff; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; pointer-events: none; }
  .marca-dagua {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='140'%3E%3Ctext x='10' y='80' transform='rotate(-25 110 70)' font-family='Georgia' font-size='18' fill='white' fill-opacity='0.2'%3Esó pra você%3C/text%3E%3C/svg%3E");
  }
  .premio-tela p { margin: 0; max-width: 340px; font-size: 1.1rem; line-height: 1.4; }
  .premio-tela .premio-aviso { font-size: .9rem; color: #c9bddc; font-style: italic; }
  .premio-acoes { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .premio-acoes[hidden] { display: none; }
  .premio-linha { display: flex; gap: 10px; }
  .premio-senha input {
    width: 230px; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 10px;
    font-family: "Newsreader", Georgia, serif; font-size: 1.05rem; text-align: center;
  }
  .btn-sair { background: var(--rosa); border-color: var(--rosa); color: #fff; }
  .btn-sair:hover { background: #a93a5b; }

  /* botão de cassino no topo + janelinha da sorte */
  .btn-cassino { position: relative; min-width: 48px; justify-content: center; padding: 8px 14px; font-size: 1.35rem; }
  .ponto-novo {
    position: absolute; top: 3px; right: 3px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--rosa); border: 2px solid #fff;
  }
  .sorte-tela {
    position: fixed; inset: 0; z-index: 15; background: rgba(20, 12, 32, .85);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .sorte-tela[hidden] { display: none; }
  .sorte-caixa {
    width: 100%; max-width: 340px; background: var(--papel); border-radius: 12px;
    padding: 24px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }
  .sorte-titulo { margin: 0; font-family: "Caveat", cursive; font-size: 2.2rem; font-weight: 500; color: var(--tinta); }
  .sorte-sub { margin: 0; font-size: .95rem; color: var(--suave); }
  .sorte-caixa .roleta { flex: none; width: 110px; height: 110px; font-size: 3.6rem; }
  .sorte-caixa .btn-jogar { flex: none; width: 100%; }
  .sorte-msg { margin: 0; min-height: 1.4em; font-size: 1rem; color: var(--tinta); }

  .aviso-teste {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25; padding: 6px 12px;
    background: #ffd978; color: #3b2a55; font-size: .8rem; text-align: center;
    padding-top: calc(6px + env(safe-area-inset-top, 0px));
  }

  /* ===== BARRA DE COMANDOS (lupa) ===== */
  .busca-tela {
    position: fixed; inset: 0; z-index: 16; background: rgba(20, 12, 32, .85);
    display: flex; align-items: flex-start; justify-content: center;
    padding: calc(72px + env(safe-area-inset-top, 0px)) 24px 24px;
  }
  .busca-tela[hidden] { display: none; }
  .busca-caixa {
    width: 100%; max-width: 420px; background: var(--papel); border-radius: 12px;
    padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
  }
  .busca-linha { display: flex; gap: 8px; width: 100%; }
  .busca-linha input {
    flex: 1; min-width: 0; padding: 12px 16px; border: 1px solid var(--linha); border-radius: 999px;
    font-family: "Newsreader", Georgia, serif; font-size: 1.05rem; color: var(--tinta); background: #fff;
  }
  .busca-msg { margin: 0; min-height: 1.4em; font-size: 1rem; color: var(--tinta); text-align: center; }

  /* ===== CHUVA (comando rain) ===== */
  .chuva {
    position: fixed; inset: 0; z-index: 18; background: rgba(20, 12, 32, .35);
    overflow: hidden; cursor: pointer; transition: opacity 1s ease;
  }
  .chuva.saindo { opacity: 0; }
  .gota {
    position: absolute; top: -40px; width: 2px; height: 18px; border-radius: 2px;
    background: linear-gradient(to bottom, rgba(200, 220, 255, 0), rgba(200, 220, 255, .85));
    animation: cair linear infinite;
  }
  @keyframes cair { to { transform: translateY(110vh); } }
  .chuva-dica {
    position: absolute; left: 0; right: 0; margin: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #fff; font-style: italic; font-size: .95rem; opacity: .85;
  }

  /* ===== PAINEL DE TESTE (só aparece com ?teste no endereço) ===== */
  .painel-teste {
    position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    display: flex; flex-direction: column; gap: 6px; max-width: 210px; padding: 10px;
    background: rgba(20, 12, 32, .94); color: #fff; border-radius: 10px; font-size: .85rem;
  }
  .painel-teste button {
    border: 0; border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--tinta);
    font-family: inherit; font-size: .85rem; text-align: left; cursor: pointer;
  }

  /* ===== ENVELOPE ===== */
  .envelope-tela {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    width: 100%; border: 0; padding: 24px;
    background: var(--noite); color: var(--papel);
    font-family: "Newsreader", Georgia, serif; font-size: 1.1rem; text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .7s ease, visibility .7s;
  }
  .envelope-tela.saindo { opacity: 0; visibility: hidden; }
  .envelope { position: relative; display: block; width: min(78vw, 320px); aspect-ratio: 3 / 2; perspective: 900px; }
  .envelope-dica { display: block; max-width: 300px; line-height: 1.4; font-style: italic; }
  .env-corpo, .env-papel, .env-frente, .env-aba, .env-selo { position: absolute; display: block; }
  .env-corpo { inset: 0; background: #cbbde0; border-radius: 6px; box-shadow: 0 14px 40px rgba(0, 0, 0, .4); }
  .env-papel { left: 7%; right: 7%; top: 52%; height: 40%; background: var(--papel); border-radius: 3px; z-index: 1; transition: transform .8s ease .5s; }
  .env-frente { inset: 0; background: #ddd1ed; border-radius: 6px; clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); z-index: 2; }
  .env-aba { left: 0; right: 0; top: 0; height: 52%; background: #e9e0f4; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .7s ease; z-index: 3; }
  .env-selo {
    left: 50%; top: 52%; width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border-radius: 50%; background: var(--rosa); color: #fff; z-index: 4;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    transition: opacity .3s; animation: pulsar 1.4s ease-in-out infinite;
  }
  @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  .aberto .env-selo { opacity: 0; animation: none; }
  .aberto .env-aba { transform: rotateX(180deg); z-index: 0; }
  .aberto .env-papel { transform: translateY(-125%); }

  @media (prefers-reduced-motion: reduce) {
    .carta.visivel, .carta.visivel.volta, .calendario { animation: none; }
    .env-aba, .env-papel, .envelope-tela { transition: none; }
    .env-selo, .premio-btn, .premio-btn::after, .roleta.girando { animation: none; }
  }
</style>
</head>
<body>
  <button class="envelope-tela" id="envelope" type="button" aria-label="Abrir a carta">
    <span class="envelope">
      <span class="env-corpo"></span>
      <span class="env-papel"></span>
      <span class="env-frente"></span>
      <span class="env-aba"></span>
      <span class="env-selo">♥</span>
    </span>
    <span class="envelope-dica" id="envelope-dica"></span>
  </button>

  <main class="carta" id="tela-carta">
    <div class="topo">
      <button type="button" class="btn-nav btn-cassino" id="abrir-busca" aria-label="Comandos"><span aria-hidden="true">🔍</span></button>
      <button type="button" class="btn-nav btn-cassino" id="abrir-sorte" aria-label="Sorte do dia"><span aria-hidden="true">🎰</span><span class="ponto-novo" id="ponto-novo" hidden></span></button>
      <button type="button" class="btn-nav" id="abrir-cal"><span aria-hidden="true">📅</span> Calendário</button>
    </div>
    <p class="data" id="data"></p>
    <p class="clima" id="clima">Olhando o céu da sua cidade...</p>
    <img class="foto" id="foto" alt="Nós dois">
    <p class="mensagem" id="mensagem"></p>
    <p class="assinatura" id="assinatura"></p>

    <div class="confirmar">
      <button type="button" class="btn-lida" id="btn-lida">Li a carta de hoje 💌</button>
      <p class="sequencia" id="sequencia"></p>
    </div>
    <div class="jogo">
      <div class="jogo-topo"><span>⭐ Meus pontos</span><strong id="pontos-valor">0 / 20</strong></div>
      <div class="barra"><div class="barra-cheia" id="barra"></div></div>
      <p class="jogo-msg" id="jogo-msg"></p>
    </div>

    <p class="juntos" id="juntos"></p>
  </main>

  <section class="calendario" id="tela-calendario" hidden>
    <button type="button" class="btn-nav" id="voltar-carta"><span aria-hidden="true">←</span> Voltar à carta</button>
    <h2 class="cal-titulo">Nosso calendário</h2>
    <div class="cal-nav">
      <button type="button" id="mes-anterior" aria-label="Mês anterior">‹</button>
      <span class="cal-mes" id="cal-mes"></span>
      <button type="button" id="mes-proximo" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal-grade" id="cal-grade"></div>
    <p class="cal-resumo" id="cal-resumo"></p>
  </section>

  <div class="sorte-tela" id="sorte-tela" hidden>
    <div class="sorte-caixa">
      <h2 class="sorte-titulo">🎰 Sorte do dia</h2>
      <p class="sorte-sub">Uma jogada por dia: de 1 a 3 pontos.</p>
      <div class="roleta" id="roleta">?</div>
      <button type="button" class="btn-jogar" id="btn-jogar">🎰 Girar</button>
      <p class="sorte-msg" id="sorte-msg"></p>
      <button type="button" class="btn-nav" id="sorte-fechar">Fechar</button>
    </div>
  </div>

  <div class="busca-tela" id="busca-tela" hidden>
    <div class="busca-caixa">
      <div class="busca-linha">
        <input type="text" id="busca-campo" placeholder="Digite um comando..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="btn-nav btn-sair" id="busca-enviar">OK</button>
      </div>
      <p class="busca-msg" id="busca-msg"></p>
      <button type="button" class="btn-nav" id="busca-fechar">Fechar</button>
    </div>
  </div>

  <button type="button" class="premio-btn" id="premio-btn" hidden aria-label="Surpresa de visualização única">⭐</button>

  <div class="premio-tela" id="premio-tela" hidden>
    <img id="premio-img" alt="Surpresa" style="display:none">
    <div class="marca-dagua"></div>
    <p id="premio-texto"></p>
    <div class="premio-acoes premio-senha" id="premio-senha" hidden>
      <p class="premio-aviso" id="premio-dica"></p>
      <input type="password" id="premio-campo-senha" placeholder="Senha secreta" autocomplete="off">
      <p class="premio-aviso" id="premio-erro"></p>
      <div class="premio-linha">
        <button type="button" class="btn-nav" id="premio-adiar">Agora não</button>
        <button type="button" class="btn-nav btn-sair" id="premio-abrir">Abrir</button>
      </div>
    </div>
    <div class="premio-acoes" id="premio-acao1">
      <p class="premio-aviso">Visualização única: depois de sair, não dá pra ver de novo.</p>
      <button type="button" class="btn-nav" id="premio-fechar">Sair</button>
    </div>
    <div class="premio-acoes" id="premio-acao2" hidden>

/* =====================================================
   DESCRIÇÃO DO CLIMA
===================================================== */
function descreverClima(codigo) {
  if (codigo === 0) return "céu limpo";
  if (codigo === 1) return "principalmente limpo";
  if (codigo === 2) return "parcialmente nublado";
  if (codigo === 3) return "nublado";
  if (codigo === 45 || codigo === 48) return "com neblina";
  if (codigo >= 51 && codigo <= 57) return "garoando";
  if (codigo >= 61 && codigo <= 67) return "chovendo";
  if (codigo >= 71 && codigo <= 77) return "nevando";
  if (codigo >= 80 && codigo <= 82) return "com pancadas de chuva";
  if (codigo >= 95) return "com tempestade";
  return "com tempo instável";
}

/* =====================================================
   FUNÇÕES DO DIA (mudam à meia-noite, estáveis o dia todo)
===================================================== */
function numeroDoDia(data) {
  return Math.floor(
    new Date(data.getFullYear(), data.getMonth(), data.getDate()) / 86400000
  );
}

function sorteioDoDia(numero) {
  const x = Math.sin(numero * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Usa um "deslocamento" diferente da foto para as duas não ficarem sincronizadas
function escolherDoDia(lista) {
  const dia = numeroDoDia(new Date());
  return lista[Math.floor(sorteioDoDia(dia + 101) * lista.length)];
}

function mensagemDoDia() {
  return MENSAGENS[numeroDoDia(new Date()) % MENSAGENS.length];
}

function fotoDoDia() {
  const total = CONFIG.fotos.length;
  if (!total) return "";
  const hoje = numeroDoDia(new Date());
  let indice = Math.floor(sorteioDoDia(hoje) * total);
  const ontem = Math.floor(sorteioDoDia(hoje - 1) * total);
  if (total > 1 && indice === ontem) indice = (indice + 1) % total;
  return CONFIG.fotos[indice];
}

function diasJuntos() {
  const inicio = new Date(CONFIG.inicioNamoro + "T00:00:00");
  return Math.floor((new Date() - inicio) / 86400000);
}

/* =====================================================
   MENSAGEM BASEADA NO CLIMA
===================================================== */
function mensagemSobreClima(temperatura, codigo, chanceChuva, chuvaAgora) {
  const chovendo =
    codigo >= 95 ||
    (codigo >= 51 && codigo <= 67) ||
    (codigo >= 80 && codigo <= 82) ||
    chuvaAgora > 0 ||
    chanceChuva >= 60;

  if (chovendo) return escolherDoDia(MENSAGENS_CHUVA);
  if (temperatura >= 28) return escolherDoDia(MENSAGENS_CALOR);
  if (temperatura <= 16) return escolherDoDia(MENSAGENS_FRIO);
  return escolherDoDia(MENSAGENS_NORMAL);
}

/* =====================================================
   API DO CLIMA
===================================================== */
async function carregarClima() {
  const el = document.getElementById("clima");

  try {
    // 1. Cidade -> latitude/longitude
    const urlGeo =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(CONFIG.cidadeDela) +
      "&count=1&language=pt&format=json";

    const respostaGeo = await fetch(urlGeo);
    if (!respostaGeo.ok) throw new Error("Erro ao localizar cidade.");

    const geo = await respostaGeo.json();
    if (!geo.results || !geo.results.length) throw new Error("Cidade não encontrada.");

    const { latitude, longitude, name } = geo.results[0];

    // 2. Clima atual + chance de chuva por hora
    // forecast_days=2 garante horas suficientes mesmo à noite
    const urlClima =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + latitude +
      "&longitude=" + longitude +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
      "&hourly=precipitation_probability" +
      "&timezone=America%2FSao_Paulo" +
      "&forecast_days=2";

    const respostaClima = await fetch(urlClima);
    if (!respostaClima.ok) throw new Error("Erro ao buscar clima.");

    const clima = await respostaClima.json();
    const atual = clima.current;

    const temperatura = Math.round(atual.temperature_2m);
    const sensacao = Math.round(atual.apparent_temperature);
    const umidade = Math.round(atual.relative_humidity_2m);
    const vento = Math.round(atual.wind_speed_10m);
    const chuvaAgora = Number(atual.precipitation || 0);
    const codigo = atual.weather_code;

    // 3. Maior chance de chuva nas próximas 6 horas
    // Usa a hora que a própria API informa (horário de Brasília), não a do aparelho
    let chanceChuva = 0;
    const probs = clima.hourly && clima.hourly.precipitation_probability;
    if (probs && probs.length) {
      const hora = Number(atual.time.slice(11, 13));
      const proximas = probs.slice(hora, hora + 6).filter(v => v !== null);
      if (proximas.length) chanceChuva = Math.max(...proximas);
    }

    const cuidado = mensagemSobreClima(temperatura, codigo, chanceChuva, chuvaAgora);

    el.innerHTML =
      "Em " + name + " agora: <strong>" + temperatura + "°C</strong>" +
      "<br><br><span class='cuidado'>" + cuidado + "</span>";

  } catch (erro) {
    console.error("Erro no clima:", erro);
    el.innerHTML = "Não consegui olhar o tempo agora.<br>Mas espero que seu dia esteja lindo. ❤️";
  }
}

function configurarCalendario() {
  const telaCarta = document.getElementById("tela-carta");
  const telaCal = document.getElementById("tela-calendario");
  const grade = document.getElementById("cal-grade");
  const rotuloMes = document.getElementById("cal-mes");
  const resumo = document.getElementById("cal-resumo");
  const MESES = [
    "janeiro", "fevereiro", "março", "abril", "maio", "junho",
    "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
  ];

  let ano = new Date().getFullYear();
  let mes = new Date().getMonth();

  function desenhar() {
    const lidos = new Set(lerProgresso().dias || []);
    const hojeChave = chaveDia(new Date());

    rotuloMes.textContent = MESES[mes] + " de " + ano;
    grade.innerHTML = "";

    ["D", "S", "T", "Q", "Q", "S", "S"].forEach((letra) => {
      const c = document.createElement("div");
      c.className = "cal-cab";
      c.textContent = letra;
      grade.appendChild(c);
    });

    // espaços vazios até o dia da semana em que o mês começa
    const vazios = new Date(ano, mes, 1).getDay();
    for (let i = 0; i < vazios; i++) grade.appendChild(document.createElement("div"));

    const total = new Date(ano, mes + 1, 0).getDate();
    let lidosNoMes = 0;

    for (let d = 1; d <= total; d++) {
      const chave = chaveDia(new Date(ano, mes, d));
      const c = document.createElement("div");
      c.className = "cal-dia";
      c.textContent = d;
      if (lidos.has(chave)) { c.classList.add("lido"); lidosNoMes++; }
      if (chave === hojeChave) c.classList.add("hoje");
      grade.appendChild(c);
    }

    resumo.textContent =
      lidosNoMes + (lidosNoMes === 1 ? " carta lida" : " cartas lidas") +
      " em " + MESES[mes] + " · " + lidos.size + " no total";
  }

  document.getElementById("mes-anterior").addEventListener("click", () => {
    mes--;
    if (mes < 0) { mes = 11; ano--; }
    desenhar();
  });

  document.getElementById("mes-proximo").addEventListener("click", () => {
    mes++;
    if (mes > 11) { mes = 0; ano++; }
    desenhar();
  });

  document.getElementById("abrir-cal").addEventListener("click", () => {
    const agora = new Date();
    ano = agora.getFullYear();
    mes = agora.getMonth();
    desenhar();
    telaCarta.classList.add("oculta");
    telaCal.hidden = false;
    window.scrollTo(0, 0);
  });

  document.getElementById("voltar-carta").addEventListener("click", () => {
    telaCal.hidden = true;
    telaCarta.classList.add("volta");
    telaCarta.classList.remove("oculta");
    window.scrollTo(0, 0);
  });
}

// Abre uma foto criptografada (formato: sal 16 bytes + iv 12 bytes + dados) e devolve um endereço temporário
async function descriptografarFoto(url, tipo, senha) {
  if (!window.crypto || !window.crypto.subtle) throw new Error("Navegador sem suporte a criptografia");
  const resposta = await fetch(url);
  if (!resposta.ok) throw new Error("Foto não encontrada");
  const bytes = new Uint8Array(await resposta.arrayBuffer());
  const sal = bytes.slice(0, 16);
  const iv = bytes.slice(16, 28);
  const dados = bytes.slice(28);

  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: sal, iterations: 200000, hash: "SHA-256" },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, dados);
  return URL.createObjectURL(new Blob([claro], { type: tipo }));
}

  });

  document.getElementById("sorte-fechar").addEventListener("click", () => {
    sorteTela.hidden = true;
  });

  botao.addEventListener("click", () => {
    const j = lerJogo();
    const hoje = numeroDoDia(new Date());
    if (!cicloTeste && j.ultimoJogo === hoje) return;

    // Sorteia e salva ANTES da animação: fechar a página não dá outra chance
    // (no ciclo de teste, cada giro dá a meta inteira e não tem limite por dia)
    const ganhou = cicloTeste ? CONFIG.metaPontos : sortearPontos();
    j.ultimoJogo = hoje;
    j.ultimoResultado = ganhou;
    j.pontos = cicloTeste ? CONFIG.metaPontos : (j.pontos || 0) + ganhou;
    salvarJogo(j);

    botao.disabled = true;
    botao.textContent = "Girando...";
    roleta.classList.add("girando");

    let giros = 0;
    const timer = setInterval(() => {
      roleta.textContent = "+" + (1 + Math.floor(Math.random() * 3));
      giros++;
      if (giros >= 16) {
        clearInterval(timer);
        roleta.classList.remove("girando");
        roleta.textContent = "+" + ganhou;
        let resultado =
          ganhou >= CONFIG.metaPontos ? "🧪 Ciclo de teste: +" + ganhou + " pontos!" :
          ganhou === 3 ? "🎉 Sorte grande! +3 pontos!" :
          ganhou === 2 ? "✨ +2 pontos!" :
          "💜 +1 ponto, amanhã tem mais!";
        const atual = lerJogo();
        if ((atual.pontos || 0) >= CONFIG.metaPontos) {
          resultado += " 🎁 Surpresa liberada!";
        }
        sorteMsg.textContent = resultado;
        atualizarJogo(resultado);
      }
    }, 90);
  });

  // ----- Surpresa: UMA foto ALEATÓRIA por prêmio (fotos criptografadas na pasta "surpresa") -----
  const acao1 = document.getElementById("premio-acao1");
  const acao2 = document.getElementById("premio-acao2");
  const blocoSenha = document.getElementById("premio-senha");
  const campoSenha = document.getElementById("premio-campo-senha");
  const erroSenha = document.getElementById("premio-erro");
  let sessao = 0;        // evita misturar aberturas se ela abrir e fechar rápido
  let listaFotos = [];   // [{ arquivo, tipo }, ...] lida de surpresa/lista.json
  let escolhida = null;  // posição da foto sorteada pra esse prêmio
  let fotoUrl = null;    // endereço temporário (blob:) da foto aberta
  let fotoMostrada = false;

  function limparFoto() {
    img.style.display = "none";
    img.removeAttribute("src");
    if (fotoUrl) { URL.revokeObjectURL(fotoUrl); fotoUrl = null; }
    fotoMostrada = false;
  }

  // Esconde a foto quando ela sai do app ou troca de aba
  document.addEventListener("visibilitychange", () => {
    img.style.visibility = document.hidden ? "hidden" : "visible";
  });

  async function carregarLista() {
    try {
      const resposta = await fetch(CONFIG.pastaSurpresa + "/lista.json", { cache: "no-store" });
      if (!resposta.ok) return [];
      const dados = await resposta.json();
      return Array.isArray(dados) ? dados : [];
    } catch (e) {
      return [];
    }
  }

  // Sorteia uma foto que ela ainda não ganhou e guarda a escolha (se reabrir, é a mesma)
  function sortearFoto(total) {
    const j = lerJogo();
    if (typeof j.premioFoto === "number" && j.premioFoto < total) return j.premioFoto;

    let ganhas = (j.fotosGanhas || []).filter((i) => i < total);
    let livres = [];
    for (let i = 0; i < total; i++) if (!ganhas.includes(i)) livres.push(i);
    if (!livres.length) {            // já ganhou todas: recomeça o sorteio
      j.fotosGanhas = [];
      for (let i = 0; i < total; i++) livres.push(i);
    }
    const indice = livres[Math.floor(Math.random() * livres.length)];
    j.premioFoto = indice;
    salvarJogo(j);
    return indice;
  }

  async function abrirFoto(senha, minhaSessao) {
    erroSenha.textContent = "";
    try {
      const item = listaFotos[escolhida];
      const url = await descriptografarFoto(CONFIG.pastaSurpresa + "/" + item.arquivo, item.tipo, senha);
      if (minhaSessao !== sessao) { URL.revokeObjectURL(url); return; }
      fotoUrl = url;
      fotoMostrada = true;
      img.src = url;
      img.style.display = "";
      blocoSenha.hidden = true;
      acao1.hidden = false;
    } catch (e) {
      if (minhaSessao !== sessao) return;
      erroSenha.textContent = CONFIG.senhaSurpresa
        ? "Não consegui abrir a foto. Confira a senha no CONFIG."
        : "Senha errada, tenta de novo. 💜";
      document.getElementById("premio-dica").textContent = CONFIG.dicaSenha;
      blocoSenha.hidden = false;
      acao1.hidden = true;
    }
  }

  // Toque na estrela
  premioBtn.addEventListener("click", async () => {
    const minhaSessao = ++sessao;
    limparFoto();
    erroSenha.textContent = "";
    campoSenha.value = "";
    document.getElementById("premio-texto").textContent = CONFIG.recompensaTexto;
    acao1.hidden = false;
    acao2.hidden = true;
    blocoSenha.hidden = true;
    tela.hidden = false;

    listaFotos = await carregarLista();
    if (minhaSessao !== sessao) return;
    if (!listaFotos.length) return; // sem fotos: mostra só o texto

    escolhida = sortearFoto(listaFotos.length);

    if (CONFIG.senhaSurpresa) {
      abrirFoto(CONFIG.senhaSurpresa, minhaSessao);
    } else {
      acao1.hidden = true;
      document.getElementById("premio-dica").textContent = CONFIG.dicaSenha;
      blocoSenha.hidden = false;
      campoSenha.focus();
    }
  });

  document.getElementById("premio-abrir").addEventListener("click", () => {
    if (campoSenha.value) abrirFoto(campoSenha.value, sessao);
  });

  campoSenha.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("premio-abrir").click();
  });

  // "Agora não": fecha sem gastar o prêmio (a mesma foto volta na próxima vez)
  document.getElementById("premio-adiar").addEventListener("click", () => {
    sessao++;
    limparFoto();
    tela.hidden = true;
  });

  // "Sair" só pergunta se ela tem certeza
  document.getElementById("premio-fechar").addEventListener("click", () => {
    acao1.hidden = true;
    acao2.hidden = false;
  });

  // "Ainda não" volta pra foto
  document.getElementById("premio-voltar").addEventListener("click", () => {
    acao2.hidden = true;
    acao1.hidden = false;
  });

  // "Sim, sair": a foto some. Gasta 20 pontos; ao juntar de novo, vem outra foto
  document.getElementById("premio-confirmar").addEventListener("click", () => {
    const viu = fotoMostrada;
    sessao++;
    limparFoto();
    tela.hidden = true;

    if (cicloTeste) {
      // Teste: zera tudo pra poder girar e ganhar de novo
      try { localStorage.removeItem(CHAVE_JOGO); } catch (e) {}
      roleta.textContent = "?";
      sorteMsg.textContent = "";
      atualizarJogo("🧪 Ciclo reiniciado: gire de novo!");
      return;
    }

    if (!viu) { atualizarJogo(); return; } // não chegou a ver a foto: não gasta o prêmio

    const j = lerJogo();
    j.pontos = Math.max(0, (j.pontos || 0) - CONFIG.metaPontos);
    j.fotosGanhas = j.fotosGanhas || [];
    if (typeof j.premioFoto === "number" && !j.fotosGanhas.includes(j.premioFoto)) j.fotosGanhas.push(j.premioFoto);
    delete j.premioFoto;
    salvarJogo(j);

    const faltam = Math.max(0, CONFIG.metaPontos - j.pontos);
    atualizarJogo("✨ Prêmio aberto! Faltam " + faltam + " pontos pro próximo.");
  });
}

/* =====================================================
   MODO TESTE: só aparece se o endereço terminar com ?teste
   Ex.: https://lucasproenk.github.io/carta-relacionamento-API/?teste
   Os dados mexidos ficam só no aparelho em que você testa.
===================================================== */
function configurarTeste() {
  if (!new URLSearchParams(location.search).has("teste")) return;

  const painel = document.createElement("div");
  painel.className = "painel-teste";
  painel.innerHTML = "<strong>🧪 Modo teste</strong>";

  function botao(texto, acao) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = texto;
    b.addEventListener("click", acao);
    painel.appendChild(b);
    return b;
  }

  const botaoCiclo = botao("🔁 Ciclo de teste: LIGADO", () => {
    cicloTeste = !cicloTeste;
    botaoCiclo.textContent = "🔁 Ciclo de teste: " + (cicloTeste ? "LIGADO" : "DESLIGADO");
    atualizarJogo();
  });

  const zerarRoleta = () => {
    document.getElementById("roleta").textContent = "?";
    document.getElementById("sorte-msg").textContent = "";
  };

  botao("⭐ Dar 20 pontos", () => {
    const j = lerJogo();
    j.pontos = CONFIG.metaPontos;
    j.premioVisto = false; // libera a surpresa de novo
    salvarJogo(j);
    atualizarJogo("🧪 Teste: pontos na meta!");
  });

  botao("🎰 Jogar de novo hoje", () => {
    const j = lerJogo();
    delete j.ultimoJogo;
    delete j.ultimoResultado;
    salvarJogo(j);
    zerarRoleta();
    atualizarJogo("🧪 Teste: pode girar de novo.");
  });

  // Deixa 1 ponto faltando e libera a roleta: qualquer resultado (+1, +2 ou +3) bate a meta
  botao("🎯 Roleta pra bater a meta", () => {
    const j = lerJogo();
    j.pontos = CONFIG.metaPontos - 1;
    j.premioVisto = false;
    delete j.ultimoJogo;
    delete j.ultimoResultado;
    salvarJogo(j);
    zerarRoleta();
    atualizarJogo("🧪 Teste: gire a roleta pra chegar na meta!");
  });

  botao("↺ Zerar pontos e surpresa", () => {
    try { localStorage.removeItem(CHAVE_JOGO); } catch (e) {}
    zerarRoleta();
    atualizarJogo("🧪 Teste: jogo zerado.");
  });

  botao("↺ Resetar tudo e recarregar", () => {
    try {
      localStorage.removeItem(CHAVE_JOGO);
      localStorage.removeItem(CHAVE_PROGRESSO);
    } catch (e) {}
    location.reload();
  });

  document.body.appendChild(painel);

  // ?teste=20 já abre o site com 20 pontos e a surpresa liberada
  const inicial = Number(new URLSearchParams(location.search).get("teste"));
  if (inicial > 0) {
    const j = lerJogo();
    j.pontos = inicial;
    j.premioVisto = false;
    salvarJogo(j);
    atualizarJogo("🧪 Teste: começou com " + inicial + " pontos.");
  }
}

/* =====================================================
   BARRA DE COMANDOS (lupa): cada comando só funciona UMA vez
===================================================== */
function configurarComandos() {
  const tela = document.getElementById("busca-tela");
  const campo = document.getElementById("busca-campo");
  const msg = document.getElementById("busca-msg");

  // comando -> pontos que ele dá (use minúsculas)
  const COMANDOS = { bets: CONFIG.metaPontos };

  // Música do comando rain (link do Spotify)
  const LINK_RAIN = "https://open.spotify.com/intl-pt/track/1uvyZBs4IZYRebHIB1747m?si=e0156032b47444d6";

  // comando -> efeito na tela (pode usar quantas vezes quiser)
  const EFEITOS = {
    rain: () => {
      fechar();
      if (document.querySelector(".chuva")) { window.open(LINK_RAIN, "_blank"); return; }

      const chuva = document.createElement("div");
      chuva.className = "chuva";

      const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduzir) {
        for (let i = 0; i < 90; i++) {
          const g = document.createElement("span");
          g.className = "gota";
          g.style.left = (Math.random() * 100) + "%";
          g.style.animationDuration = (0.6 + Math.random() * 0.7) + "s";
          g.style.animationDelay = (-Math.random() * 1.3) + "s";
          g.style.opacity = String(0.4 + Math.random() * 0.6);
          chuva.appendChild(g);
        }
      }

      const dica = document.createElement("p");
      dica.className = "chuva-dica";
      dica.textContent = "toque na tela pra parar a chuva 🌧️";
      chuva.appendChild(dica);

      chuva.addEventListener("click", () => {
        chuva.classList.add("saindo");
        setTimeout(() => chuva.remove(), 1000);
      });

      document.body.appendChild(chuva);
      window.open(LINK_RAIN, "_blank");
    }
  };

  function abrir() {
    msg.textContent = "";
    campo.value = "";
    tela.hidden = false;
    campo.focus();
  }

  function fechar() {
    tela.hidden = true;
  }

  function executar() {
    const texto = campo.value.trim().toLowerCase();
    if (!texto) return;
    campo.value = "";

    if (Object.prototype.hasOwnProperty.call(EFEITOS, texto)) {
      EFEITOS[texto]();
      return;
    }

    if (!Object.prototype.hasOwnProperty.call(COMANDOS, texto)) {
      msg.textContent = "Comando não encontrado 🔍";
      return;
    }

    const j = lerJogo();
    j.comandosUsados = j.comandosUsados || [];
    if (j.comandosUsados.includes(texto)) {
      msg.textContent = "Esse comando já foi usado 💜";
      return;
    }

    const pontos = COMANDOS[texto];
    j.comandosUsados.push(texto);
    j.pontos = (j.pontos || 0) + pontos;
    salvarJogo(j);

    msg.textContent = "✨ +" + pontos + " pontos!";
    atualizarJogo("🔓 Comando secreto: +" + pontos + " pontos!");
  }

  document.getElementById("abrir-busca").addEventListener("click", abrir);
  document.getElementById("busca-fechar").addEventListener("click", fechar);
  document.getElementById("busca-enviar").addEventListener("click", executar);
  campo.addEventListener("keydown", (e) => {
    if (e.key === "Enter") executar();
  });
}

function configurarConfirmacao() {
  const botao = document.getElementById("btn-lida");
  const info = document.getElementById("sequencia");
  const ler = lerProgresso;
  const salvar = salvarProgresso;

  // Se ela já tinha confirmado hoje antes do calendário existir, marca o dia
  const inicial = ler();
  inicial.dias = inicial.dias || [];
  if (inicial.ultimo === numeroDoDia(new Date()) && !inicial.dias.includes(chaveDia(new Date()))) {
    inicial.dias.push(chaveDia(new Date()));
    salvar(inicial);
  }

  function mostrar(p) {
    const hoje = numeroDoDia(new Date());
    const lidaHoje = p.ultimo === hoje;
    const ativa = p.ultimo === hoje || p.ultimo === hoje - 1; // sequência só vale se leu hoje ou ontem

    botao.textContent = lidaHoje ? "Carta de hoje lida ✓" : "Li a carta de hoje 💌";
    botao.classList.toggle("lida", lidaHoje);
    botao.disabled = lidaHoje;

    info.textContent = ativa && p.sequencia > 0
      ? "❤️ " + p.sequencia + (p.sequencia === 1 ? " dia" : " dias") + " seguidos lendo a carta"
      : "";
  }

  mostrar(ler());

  botao.addEventListener("click", () => {
    const hoje = numeroDoDia(new Date());
    const p = ler();
    if (p.ultimo === hoje) return;

    p.sequencia = p.ultimo === hoje - 1 ? (p.sequencia || 0) + 1 : 1;
    p.total = (p.total || 0) + 1;
    p.ultimo = hoje;
    p.dias = p.dias || [];
    const chave = chaveDia(new Date());
    if (!p.dias.includes(chave)) p.dias.push(chave);
    salvar(p);
    mostrar(p);
    ganharPontoDeLeitura();

    // Abre o WhatsApp com a mensagem pronta (ela só precisa apertar enviar)
    if (CONFIG.whatsappDele) {
      const texto = "Oi, " + CONFIG.seuNome + "! Li a carta de hoje ❤️" +
        (p.sequencia > 1 ? " (" + p.sequencia + " dias seguidos!)" : "");
      window.open(
        "https://wa.me/" + CONFIG.whatsappDele + "?text=" + encodeURIComponent(texto),
        "_blank"
      );
    }
  });
}

/* =====================================================
   ENVELOPE: toque para abrir a carta
===================================================== */
function configurarEnvelope() {
  const tela = document.getElementById("envelope");
  const carta = document.querySelector(".carta");

  document.getElementById("envelope-dica").textContent =
    "Uma carta pra você, " + CONFIG.nomeDela + ". Toque para abrir 💌";

  const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let aberto = false;

  tela.addEventListener("click", () => {
    if (aberto) return;
    aberto = true;
    tela.classList.add("aberto");

    setTimeout(() => {
      tela.classList.add("saindo");
      carta.classList.add("visivel");
      setTimeout(() => tela.remove(), 800);
    }, reduzir ? 0 : 1800);
  });
}

configurarEnvelope();
configurarConfirmacao();
configurarCalendario();
configurarJogo();
configurarTeste();
configurarComandos();
montarPagina();
