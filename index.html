    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);

    opacity: 0;
  }
  .carta.visivel { visibility: visible; opacity: 1; animation: abrir .9s ease-out both; }
  @keyframes abrir {
    from { opacity: 0; transform: translateY(18px) rotate(-.6deg); }

  .data { margin: 0 0 5px; color: var(--suave); font-style: italic; font-size: 1rem; }

  .clima strong { color: var(--rosa); font-size: 1.15rem; font-weight: 500; }

  .clima .cuidado { color: var(--tinta); }
  .foto {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 3px;
    margin: 0 0 28px;
    background: #ddd3ea;
    transform: rotate(-1deg);

    width: 100%; border: 0; padding: 24px;

  .envelope-dica { display: block; max-width: 300px; line-height: 1.4; font-style: italic; }
  .env-corpo, .env-papel, .env-frente, .env-aba, .env-selo { position: absolute; display: block; }
  .env-corpo { inset: 0; background: #cbbde0; border-radius: 6px; box-shadow: 0 14px 40px rgba(0, 0, 0, .4); }
  .env-papel { left: 7%; right: 7%; top: 52%; height: 40%; background: var(--papel); border-radius: 3px; z-index: 1; transition: transform .8s ease .5s; }
  .env-frente { inset: 0; background: #ddd1ed; border-radius: 6px; clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); z-index: 2; }
  .env-aba { left: 0; right: 0; top: 0; height: 52%; background: #e9e0f4; clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .7s ease; z-index: 3; }
  .env-selo {
    left: 50%; top: 52%; width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border-radius: 50%; background: var(--rosa); color: #fff; z-index: 4;
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;

    .env-aba, .env-papel, .envelope-tela { transition: none; }
    .env-selo { animation: none; }

</style>

/* =====================================================
   DESCRIÇÃO DO CLIMA
===================================================== */
function descreverClima(codigo) {
  if (codigo === 0) return "céu limpo";
  if (codigo === 1) return "principalmente limpo";
  if (codigo === 2) return "parcialmente nublado";
  if (codigo === 3) return "nublado";
  if (codigo === 45 || codigo === 48) return "com neblina";
  if (codigo >= 51 && codigo <= 57) return "garoando";
  if (codigo >= 61 && codigo <= 67) return "chovendo";
  if (codigo >= 71 && codigo <= 77) return "nevando";
  if (codigo >= 80 && codigo <= 82) return "com pancadas de chuva";
  if (codigo >= 95) return "com tempestade";
  return "com tempo instável";
}

/* =====================================================
   FUNÇÕES DO DIA (mudam à meia-noite, estáveis o dia todo)
===================================================== */
function numeroDoDia(data) {
  return Math.floor(
    new Date(data.getFullYear(), data.getMonth(), data.getDate()) / 86400000
  );
}

function sorteioDoDia(numero) {
  const x = Math.sin(numero * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Usa um "deslocamento" diferente da foto para as duas não ficarem sincronizadas
function escolherDoDia(lista) {
  const dia = numeroDoDia(new Date());
  return lista[Math.floor(sorteioDoDia(dia + 101) * lista.length)];
}

function mensagemDoDia() {
  return MENSAGENS[numeroDoDia(new Date()) % MENSAGENS.length];
}

function fotoDoDia() {
  const total = CONFIG.fotos.length;
  if (!total) return "";
  const hoje = numeroDoDia(new Date());
  let indice = Math.floor(sorteioDoDia(hoje) * total);
  const ontem = Math.floor(sorteioDoDia(hoje - 1) * total);
  if (total > 1 && indice === ontem) indice = (indice + 1) % total;
  return CONFIG.fotos[indice];
}

function diasJuntos() {
  const inicio = new Date(CONFIG.inicioNamoro + "T00:00:00");
  return Math.floor((new Date() - inicio) / 86400000);
}

/* =====================================================
   MENSAGEM BASEADA NO CLIMA
===================================================== */
function mensagemSobreClima(temperatura, codigo, chanceChuva, chuvaAgora) {
  const chovendo =
    codigo >= 95 ||
    (codigo >= 51 && codigo <= 67) ||
    (codigo >= 80 && codigo <= 82) ||
    chuvaAgora > 0 ||
    chanceChuva >= 60;

  if (chovendo) return escolherDoDia(MENSAGENS_CHUVA);
  if (temperatura >= 28) return escolherDoDia(MENSAGENS_CALOR);
  if (temperatura <= 16) return escolherDoDia(MENSAGENS_FRIO);
  return escolherDoDia(MENSAGENS_NORMAL);
}

/* =====================================================
   API DO CLIMA
===================================================== */
async function carregarClima() {
  const el = document.getElementById("clima");

  try {
    // 1. Cidade -> latitude/longitude
    const urlGeo =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(CONFIG.cidadeDela) +
      "&count=1&language=pt&format=json";

    const respostaGeo = await fetch(urlGeo);
    if (!respostaGeo.ok) throw new Error("Erro ao localizar cidade.");

    const geo = await respostaGeo.json();
    if (!geo.results || !geo.results.length) throw new Error("Cidade não encontrada.");

    const { latitude, longitude, name } = geo.results[0];

    // 2. Clima atual + chance de chuva por hora
    // forecast_days=2 garante horas suficientes mesmo à noite
    const urlClima =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + latitude +
      "&longitude=" + longitude +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
      "&hourly=precipitation_probability" +
      "&timezone=America%2FSao_Paulo" +
      "&forecast_days=2";

    const respostaClima = await fetch(urlClima);
    if (!respostaClima.ok) throw new Error("Erro ao buscar clima.");

    const clima = await respostaClima.json();
    const atual = clima.current;

    const temperatura = Math.round(atual.temperature_2m);
    const sensacao = Math.round(atual.apparent_temperature);
    const umidade = Math.round(atual.relative_humidity_2m);
    const vento = Math.round(atual.wind_speed_10m);
    const chuvaAgora = Number(atual.precipitation || 0);
    const codigo = atual.weather_code;

    // 3. Maior chance de chuva nas próximas 6 horas
    // Usa a hora que a própria API informa (horário de Brasília), não a do aparelho
    let chanceChuva = 0;
    const probs = clima.hourly && clima.hourly.precipitation_probability;
    if (probs && probs.length) {
      const hora = Number(atual.time.slice(11, 13));
      const proximas = probs.slice(hora, hora + 6).filter(v => v !== null);
      if (proximas.length) chanceChuva = Math.max(...proximas);
    }

    const cuidado = mensagemSobreClima(temperatura, codigo, chanceChuva, chuvaAgora);

    el.innerHTML =
      "Em " + name + " agora: <strong>" + temperatura + "°C</strong>" +
      "<br><br><span class='cuidado'>" + cuidado + "</span>";

  } catch (erro) {
    console.error("Erro no clima:", erro);
    el.innerHTML = "Não consegui olhar o tempo agora.<br>Mas espero que seu dia esteja lindo. ❤️";
  }
}

    new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

  // Foto do dia; se a imagem não existir, esconde em vez de mostrar ícone quebrado
  const foto = document.getElementById("foto");
  foto.onerror = () => { foto.style.display = "none"; };
  foto.src = fotoDoDia();

  document.getElementById("mensagem").textContent = "Oi, " + CONFIG.nomeDela + ". " + mensagemDoDia();
  document.getElementById("assinatura").textContent = "— " + CONFIG.seuNome;

  const dias = diasJuntos();
  document.getElementById("juntos").innerHTML = dias >= 0
    ? "Hoje fazem <strong>" + dias.toLocaleString("pt-BR") + " dias</strong> que a gente tá junto."
    : "";

  carregarClima();
}

/* =====================================================
   CONFIRMAR LEITURA + SEQUÊNCIA DE DIAS
===================================================== */
const CHAVE_PROGRESSO = "cartaDoDia";

function lerProgresso() {
  try { return JSON.parse(localStorage.getItem(CHAVE_PROGRESSO)) || {}; } catch (e) { return {}; }
}

function salvarProgresso(p) {
  try { localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(p)); } catch (e) {}
}

// Data no formato "AAAA-MM-DD" (horário local)
function chaveDia(data) {
  const m = String(data.getMonth() + 1).padStart(2, "0");
  const d = String(data.getDate()).padStart(2, "0");
  return data.getFullYear() + "-" + m + "-" + d;
}

/* =====================================================
   CALENDÁRIO (segunda tela, dentro da mesma página)
===================================================== */
function configurarCalendario() {
  const telaCarta = document.getElementById("tela-carta");
  const telaCal = document.getElementById("tela-calendario");
  const grade = document.getElementById("cal-grade");
  const rotuloMes = document.getElementById("cal-mes");
  const resumo = document.getElementById("cal-resumo");
  const MESES = [
    "janeiro", "fevereiro", "março", "abril", "maio", "junho",
    "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
  ];

  let ano = new Date().getFullYear();
  let mes = new Date().getMonth();

  function desenhar() {
    const lidos = new Set(lerProgresso().dias || []);
    const hojeChave = chaveDia(new Date());

    rotuloMes.textContent = MESES[mes] + " de " + ano;
    grade.innerHTML = "";

    ["D", "S", "T", "Q", "Q", "S", "S"].forEach((letra) => {
      const c = document.createElement("div");
      c.className = "cal-cab";
      c.textContent = letra;
      grade.appendChild(c);
    });

    // espaços vazios até o dia da semana em que o mês começa
    const vazios = new Date(ano, mes, 1).getDay();
    for (let i = 0; i < vazios; i++) grade.appendChild(document.createElement("div"));

    const total = new Date(ano, mes + 1, 0).getDate();
    let lidosNoMes = 0;

    for (let d = 1; d <= total; d++) {
      const chave = chaveDia(new Date(ano, mes, d));
      const c = document.createElement("div");
      c.className = "cal-dia";
      c.textContent = d;
      if (lidos.has(chave)) { c.classList.add("lido"); lidosNoMes++; }
      if (chave === hojeChave) c.classList.add("hoje");
      grade.appendChild(c);
    }

    resumo.textContent =
      lidosNoMes + (lidosNoMes === 1 ? " carta lida" : " cartas lidas") +
      " em " + MESES[mes] + " · " + lidos.size + " no total";
  }

  document.getElementById("mes-anterior").addEventListener("click", () => {
    mes--;
    if (mes < 0) { mes = 11; ano--; }
    desenhar();
  });

  document.getElementById("mes-proximo").addEventListener("click", () => {
    mes++;
    if (mes > 11) { mes = 0; ano++; }
    desenhar();
  });

  document.getElementById("abrir-cal").addEventListener("click", () => {
    const agora = new Date();
    ano = agora.getFullYear();
    mes = agora.getMonth();
    desenhar();
    telaCarta.classList.add("oculta");
    telaCal.hidden = false;
    window.scrollTo(0, 0);
  });

  document.getElementById("voltar-carta").addEventListener("click", () => {
    telaCal.hidden = true;
    telaCarta.classList.remove("oculta");
    window.scrollTo(0, 0);
  });
}

function configurarConfirmacao() {
  const botao = document.getElementById("btn-lida");
  const info = document.getElementById("sequencia");
  const ler = lerProgresso;
  const salvar = salvarProgresso;

  // Se ela já tinha confirmado hoje antes do calendário existir, marca o dia
  const inicial = ler();
  inicial.dias = inicial.dias || [];
  if (inicial.ultimo === numeroDoDia(new Date()) && !inicial.dias.includes(chaveDia(new Date()))) {
    inicial.dias.push(chaveDia(new Date()));
    salvar(inicial);
  }

  function mostrar(p) {
    const hoje = numeroDoDia(new Date());
    const lidaHoje = p.ultimo === hoje;
    const ativa = p.ultimo === hoje || p.ultimo === hoje - 1; // sequência só vale se leu hoje ou ontem

    botao.textContent = lidaHoje ? "Carta de hoje lida ✓" : "Li a carta de hoje 💌";
    botao.classList.toggle("lida", lidaHoje);
    botao.disabled = lidaHoje;

    info.textContent = ativa && p.sequencia > 0
      ? "❤️ " + p.sequencia + (p.sequencia === 1 ? " dia" : " dias") + " seguidos lendo a carta"
      : "";
  }

  mostrar(ler());

  botao.addEventListener("click", () => {
    const hoje = numeroDoDia(new Date());
    const p = ler();
    if (p.ultimo === hoje) return;

    p.sequencia = p.ultimo === hoje - 1 ? (p.sequencia || 0) + 1 : 1;
    p.total = (p.total || 0) + 1;
    p.ultimo = hoje;
    p.dias = p.dias || [];
    const chave = chaveDia(new Date());
    if (!p.dias.includes(chave)) p.dias.push(chave);
    salvar(p);
    mostrar(p);

    // Abre o WhatsApp com a mensagem pronta (ela só precisa apertar enviar)
    if (CONFIG.whatsappDele) {
      const texto = "Oi, " + CONFIG.seuNome + "! Li a carta de hoje ❤️" +
        (p.sequencia > 1 ? " (" + p.sequencia + " dias seguidos!)" : "");
      window.open(
        "https://wa.me/" + CONFIG.whatsappDele + "?text=" + encodeURIComponent(texto),
        "_blank"
      );
    }
  });
}

/* =====================================================
   ENVELOPE: toque para abrir a carta
===================================================== */
function configurarEnvelope() {
  const tela = document.getElementById("envelope");
  const carta = document.querySelector(".carta");

  document.getElementById("envelope-dica").textContent =
    "Uma carta pra você, " + CONFIG.nomeDela + ". Toque para abrir 💌";

  const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let aberto = false;

  tela.addEventListener("click", () => {
    if (aberto) return;
    aberto = true;
    tela.classList.add("aberto");

    setTimeout(() => {
      tela.classList.add("saindo");
      carta.classList.add("visivel");
      setTimeout(() => tela.remove(), 800);
    }, reduzir ? 0 : 1800);
  });
}

configurarEnvelope();
configurarConfirmacao();
configurarCalendario();
montarPagina();
</script>
